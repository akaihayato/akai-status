name: Check services and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check services and save private status
        env:
          FIREBASE_MONITOR_EMAIL: ${{ secrets.FIREBASE_MONITOR_EMAIL }}
          FIREBASE_MONITOR_PASSWORD: ${{ secrets.FIREBASE_MONITOR_PASSWORD }}
          STATUS_MONITOR_KEY: ${{ secrets.STATUS_MONITOR_KEY }}
        run: node scripts/check.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

