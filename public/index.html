<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AkaiHayato Networkの稼働状況">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090b10">
  <title>akai status</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <img class="brand-icon" src="./akai-cat.png" width="76" height="76" alt="あかい猫" draggable="false">
      <span>AkaiHayato Network</span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">SYSTEM STATUS</p>
      <h1 id="page-title">サービス稼働状況</h1>
      <div id="overall" class="overall unknown" aria-live="polite">
        <span class="dot"></span><span>監視データを読み込んでいます…</span>
      </div>
    </section>

    <section id="services" class="services" aria-label="サービス一覧"></section>
    <footer class="footer">
      <span>GitHub Actionsが約5分ごとに確認</span>
      <span id="updated">最終更新 —</span>
    </footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
